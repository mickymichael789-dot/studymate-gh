<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyMate GH</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7f5;
    color:#17231c;
}

header{
    background:#087f3f;
    color:white;
    padding:25px 18px;
    text-align:center;
}

header h1{
    font-size:30px;
}

header p{
    margin-top:6px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.section{
    margin-bottom:25px;
}

.section h2{
    margin-bottom:12px;
}

.levels{
    display:flex;
    gap:10px;
}

.level-btn{
    flex:1;
    padding:15px;
    border:none;
    border-radius:12px;
    background:white;
    font-size:17px;
    font-weight:bold;
}

.level-btn.active{
    background:#087f3f;
    color:white;
}

.subjects{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.subject{
    background:white;
    padding:18px;
    border-radius:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.subject h3{
    margin-bottom:6px;
}

.subject p{
    color:#66736b;
    font-size:14px;
}

.study-area{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

@media(max-width:600px){

    .subjects{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<header>

    <h1>📚 StudyMate GH</h1>

    <p>Learn • Practice • Improve</p>

</header>

<div class="container">

    <div class="section">

        <h2>Choose your level</h2>

        <div class="levels">

            <button class="level-btn active">
                JHS
            </button>

            <button class="level-btn">
                SHS
            </button>

        </div>

    </div>

    <div class="section">

        <h2>JHS Subjects</h2>

        <div class="subjects">

            <div class="subject">

                <h3>English Language</h3>

                <p>Parts of Speech</p>

            </div>

            <div class="subject">

                <h3>Mathematics</h3>

                <p>Algebra</p>

            </div>

        </div>

    </div>

    <div class="section">

        <h2>Study Area</h2>

        <div class="study-area">

            <h3>Welcome to StudyMate GH 👋</h3>

            <p style="margin-top:8px;">
                Select a subject to start studying.
            </p>

        </div>

    </div>

</div>

</body>

    </html>
