<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyMate GH</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#222;
}

header{
    background:#2563eb;
    color:white;
    text-align:center;
    padding:25px 15px;
}

header h1{
    font-size:28px;
}

header p{
    margin-top:8px;
    font-size:15px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.level-buttons{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.level-btn{
    flex:1;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#ddd;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.level-btn.active{
    background:#2563eb;
    color:white;
}

.study-area{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    min-height:120px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.subjects{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}

.subject{
    background:white;
    padding:20px;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    transition:.2s;
}

.subject:hover{
    transform:translateY(-2px);
}

.subject h3{
    color:#2563eb;
    margin-bottom:8px;
}

.action{
    display:block;
    width:100%;
    margin-top:12px;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:15px;
    cursor:pointer;
}

.action:hover{
    background:#1d4ed8;
}

.note-box{
    margin-top:15px;
    padding:15px;
    background:#f1f5f9;
    border-radius:8px;
    line-height:1.6;
}

</style>
</head>

<body>

<header>
    <h1>📚 StudyMate GH</h1>
    <p>Learn • Practice • Improve</p>
</header>

<div class="container">
<button class="action"
onclick="showJHS()">
    🏠 Home
</button>
    <div class="level-buttons">
<div style="margin-top:15px;">

    <input
        id="studentName"
        type="text"
        placeholder="Enter your name"
        style="
            width:100%;
            padding:13px;
            border:1px solid #ddd;
            border-radius:8px;
            font-size:15px;
        "
    >


        <button id="jhsBtn"
        class="level-btn active"
        onclick="showJHS()">
            JHS
        </button>

        <button id="shsBtn"
        class="level-btn"
        onclick="showSHS()">
            SHS
        </button>

    </div>
<button class="action"
onclick="showProgress()">
    📊 My Progress
</button>
    <button class="action"
onclick="showPlanner()">
    📅 Study Planner
</button>    
    <div class="study-area" id="studyArea">

        <h2>📖 Study Area</h2>

        <p style="margin-top:10px;">
            Select a subject below to begin learning.
        </p>

    </div>

    <div class="subjects" id="subjects"></div>

</div>


<script>
const jhsSubjects = [
{
    name:"English Language",
    topic:"Parts of Speech",
    notes:"Parts of Speech are groups of words based on the work they do in a sentence. They include nouns, pronouns, verbs, adjectives, adverbs, prepositions, conjunctions and interjections."
},

{
    name:"English Language",
    topic:"Tenses",
    notes:"Tenses show the time when an action happens. The main forms are present, past and future tense. For example: I eat, I ate and I will eat."
},

{
    name:"English Language",
    topic:"Sentence Structure",
    notes:"Sentence structure refers to how words are arranged to form meaningful sentences. A basic sentence usually contains a subject and a predicate."
},

{
    name:"English Language",
    topic:"Comprehension",
    notes:"Comprehension involves reading a passage carefully, understanding its meaning and answering questions based on the information provided."
},

{
    name:"English Language",
    topic:"Vocabulary",
    notes:"Vocabulary refers to the words a person knows and uses. Building vocabulary helps learners understand texts and express their ideas clearly."
},

{
    name:"English Language",
    topic:"Punctuation",
    notes:"Punctuation marks help make writing clear. Common marks include the full stop, comma, question mark, exclamation mark, colon and quotation marks."
},

{
    name:"English Language",
    topic:"Direct and Indirect Speech",
    notes:"Direct speech reports the exact words spoken by someone. Indirect speech reports what someone said without using the exact words."
},

{
    name:"English Language",
    topic:"Active and Passive Voice",
    notes:"In active voice, the subject performs the action. In passive voice, the subject receives the action. Example: Ama wrote the letter. The letter was written by Ama."
},

{
    name:"English Language",
    topic:"Writing Skills",
    notes:"Writing skills include organising ideas, using correct grammar, choosing appropriate vocabulary and presenting ideas clearly in paragraphs."
},

{
    name:"English Language",
    topic:"Figures of Speech",
    notes:"Figures of speech are creative ways of using language. Examples include simile, metaphor, personification, hyperbole and irony."
},
    {
        name:"Mathematics",
        topic:"Algebra",
        notes:"Algebra uses letters and numbers to represent unknown values. For example, in 3x + 5 = 20, subtract 5 from both sides and divide by 3 to get x = 5."
    },

    {
        name:"Integrated Science",
        topic:"Living Things",
        notes:"Living things have characteristics such as nutrition, respiration, growth, movement, reproduction, sensitivity and excretion."
    },

    {
        name:"Social Studies",
        topic:"Ghana and Citizenship",
        notes:"A good citizen respects the laws of Ghana, protects public property, participates in community activities and respects the rights of others."
    },

    {
        name:"Computing",
        topic:"Computer Basics",
        notes:"Computer basics include hardware, software, input devices, output devices, storage devices and how computers process information."
    },

    {
        name:"RME",
        topic:"Moral Values",
        notes:"Moral values guide people to distinguish between right and wrong. Examples include honesty, respect, kindness, responsibility and fairness."
    },

    {
        name:"French",
        topic:"Basic French",
        notes:"Basic French includes common greetings and expressions such as Bonjour (Hello), Merci (Thank you), Oui (Yes) and Non (No)."
    },

    {
        name:"Ghanaian Language",
        topic:"Reading and Writing",
        notes:"Reading and writing involve understanding written information and expressing ideas clearly using the appropriate Ghanaian language."
    }

];


const shsSubjects = [

    {
        name:"English Language",
        topic:"Comprehension",
        notes:"Comprehension involves reading a passage carefully, understanding its meaning and answering questions based on the information given."
    },

    {
        name:"Core Mathematics",
        topic:"Quadratic Equations",
        notes:"A quadratic equation is commonly written as ax² + bx + c = 0. It can be solved by factorisation, completing the square or using the quadratic formula."
    },

    {
        name:"Integrated Science",
        topic:"Cells",
        notes:"The cell is the basic structural and functional unit of living organisms. Cells contain structures such as the nucleus, cytoplasm and cell membrane."
    },

    {
        name:"Social Studies",
        topic:"Governance",
        notes:"Governance refers to the way a country or organisation is managed. Good governance involves accountability, participation, transparency and respect for the rule of law."
    },

    {
        name:"ICT",
        topic:"Information Systems",
        notes:"An information system collects, processes, stores and distributes information to support decision-making and other activities."
    },

    {
        name:"Economics",
        topic:"Demand and Supply",
        notes:"Demand refers to the quantity of a good consumers are willing and able to buy. Supply refers to the quantity producers are willing and able to offer for sale."
    },

    {
        name:"Biology",
        topic:"Living Things",
        notes:"Biology is the study of living organisms. It covers topics such as cells, nutrition, reproduction, genetics and ecology."
    },

    {
        name:"Chemistry",
        topic:"Matter and Chemical Reactions",
        notes:"Matter is anything that has mass and occupies space. Chemical reactions involve the transformation of substances into new substances."
    },

    {
        name:"Physics",
        topic:"Force and Motion",
        notes:"Force is a push or pull that can change the motion of an object. Motion describes a change in position with time."
    },

    {
        name:"Geography",
        topic:"Map Reading",
        notes:"Map reading involves understanding symbols, scales, directions, grid references and other features used to represent places on maps."
    },

    {
        name:"Government",
        topic:"Ghanaian Government",
        notes:"Government refers to the system through which a country is governed. Ghana operates a constitutional democratic system."
    },

    {
        name:"Literature",
        topic:"Literary Appreciation",
        notes:"Literary appreciation involves understanding and analysing works such as poetry, prose and drama."
    }

];


function showJHS(){

    document.getElementById("jhsBtn").classList.add("active");
    document.getElementById("shsBtn").classList.remove("active");

    document.getElementById("studyArea").innerHTML = `

        <h2>📖 Study Area</h2>

        <p style="margin-top:10px;">
            Select a subject below to begin learning.
        </p>

    `;

    displaySubjects(jhsSubjects);

    }

function showSHS(){

    document.getElementById("shsBtn").classList.add("active");
    document.getElementById("jhsBtn").classList.remove("active");

    displaySubjects(shsSubjects);

}


function displaySubjects(subjectList){

    const container = document.getElementById("subjects");

    container.innerHTML = "";

    subjectList.forEach(function(subject){

        container.innerHTML += `

            <div class="subject"
            onclick="openSubject('${subject.name}','${subject.topic}')">

                <h3>${subject.name}</h3>

                <p>${subject.topic}</p>

            </div>

        `;

    });

}


function openSubject(subject,topic){

    document.getElementById("studyArea").innerHTML = `

        <h2>📚 ${subject}</h2>

        <p style="margin-top:10px;">
            <strong>Topic:</strong> ${topic}
        </p>

        <p style="margin-top:12px;">
            Choose what you want to do:
        </p>

        <button class="action"
        onclick="showNotes('${subject}','${topic}')">
            📖 Read Notes
        </button>

        <button class="action"
        onclick="showQuiz('${subject}','${topic}')">
            📝 Take Quiz
        </button>

        <button class="action"
        onclick="showPractice('${subject}','${topic}')">
            ✏️ Practice
        </button>

    `;

}


function showNotes(subject,topic){

    let allSubjects = jhsSubjects.concat(shsSubjects);

    let selected = allSubjects.find(function(item){

        return item.name === subject && item.topic === topic;

    });


    let noteText = selected
        ? selected.notes
        : "Notes for this topic are coming soon.";


    document.getElementById("studyArea").innerHTML = `

        <h2>📖 ${subject} Notes</h2>

        <p style="margin-top:10px;">
            <strong>Topic:</strong> ${topic}
        </p>

        <div class="note-box">
            ${noteText}
        </div>

        <button class="action"
        onclick="openSubject('${subject}','${topic}')">
            ← Back to Topic
        </button>

    `;

}


function showQuiz(subject,topic){

    const quizzes = {

        "English Language": {
            question:"Which word is a noun?",
            options:["Run","Beautiful","Teacher","Quickly"],
            answer:"Teacher"
        },

        "Mathematics": {
            question:"If 3x + 5 = 20, what is x?",
            options:["3","5","7","10"],
            answer:"5"
        },

        "Integrated Science": {
            question:"Which of these is a characteristic of living things?",
            options:["Growth","Rusting","Melting","Breaking"],
            answer:"Growth"
        },

        "Social Studies": {
            question:"Which of these is a responsibility of a good citizen?",
            options:["Destroying public property","Obeying the law","Breaking rules","Avoiding community activities"],
            answer:"Obeying the law"
        },

        "Computing": {
            question:"Which device is used to enter information into a computer?",
            options:["Monitor","Keyboard","Speaker","Projector"],
            answer:"Keyboard"
        },

        "RME": {
            question:"Which of these is a moral value?",
            options:["Honesty","Stealing","Laziness","Disrespect"],
            answer:"Honesty"
        },

        "French": {
            question:"What does 'Merci' mean in English?",
            options:["Hello","Goodbye","Thank you","Please"],
            answer:"Thank you"
        },

        "Ghanaian Language": {
            question:"Which skill involves understanding written words?",
            options:["Reading","Running","Singing","Drawing"],
            answer:"Reading"
        }

    };


    const quiz = quizzes[subject];


    if(!quiz){

        document.getElementById("studyArea").innerHTML = `

            <h2>📝 ${subject} Quiz</h2>

            <p style="margin-top:12px;">
                Quiz questions for this subject are coming soon.
            </p>

            <button class="action"
            onclick="openSubject('${subject}','${topic}')">
                ← Back to Topic
            </button>

        `;

        return;

    }


    document.getElementById("studyArea").innerHTML = `

        <h2>📝 ${subject} Quiz</h2>

        <p style="margin-top:15px;">
            <strong>${quiz.question}</strong>
        </p>

        <div style="margin-top:15px;">

            ${quiz.options.map(function(option){

                return `
                    <button class="action"
                    onclick="checkAnswer('${option}','${quiz.answer}','${subject}','${topic}')">
                        ${option}
                    </button>
                `;

            }).join("")}

        </div>

        <div id="quizResult"></div>

    `;

}


function checkAnswer(selected,correct,subject,topic){

    const result = document.getElementById("quizResult");


    if(selected === correct){
progress.quizzesCompleted++;

if(!progress.subjectsStudied.includes(subject)){
    progress.subjectsStudied.push(subject);
}

saveProgress();
        result.innerHTML = `

            <div class="note-box">

                🎉 <strong>Correct!</strong>

                <p style="margin-top:8px;">
                    Well done! Keep learning.
                </p>

                <button class="action"
                onclick="openSubject('${subject}','${topic}')">
                    ← Back to Topic
                </button>

            </div>

        `;

    }else{

        result.innerHTML = `

            <div class="note-box">

                ❌ <strong>Not quite.</strong>

                <p style="margin-top:8px;">
                    The correct answer is:
                    <strong>${correct}</strong>
                </p>

                <button class="action"
                onclick="showQuiz('${subject}','${topic}')">
                    🔄 Try Again
                </button>

            </div>

        `;

    }

}

function showPractice(subject,topic){

    const practice = {

        "English Language": [
            "Write five nouns and use each one in a sentence.",
            "Identify the verb in five different sentences."
        ],

        "Mathematics": [
            "Solve: 2x + 6 = 16.",
            "Simplify: 3x + 2x - 4."
        ],

        "Integrated Science": [
            "List five characteristics of living things.",
            "Give three examples of living organisms."
        ],

        "Social Studies": [
            "Mention five qualities of a good citizen.",
            "State three responsibilities of a citizen."
        ],

        "Computing": [
            "List five computer input devices.",
            "Mention three examples of computer output devices."
        ],

        "RME": [
            "Mention five moral values.",
            "Explain why honesty is important."
        ],

        "French": [
            "Write five common French greetings or expressions and give their English meanings.",
            "Translate: 'Merci beaucoup' into English."
        ],

        "Ghanaian Language": [
            "Write five simple words in your Ghanaian language.",
            "Write three simple sentences in your Ghanaian language."
        ]

    };


    const questions = practice[subject];


    if(!questions){

        document.getElementById("studyArea").innerHTML = `

            <h2>✏️ ${subject} Practice</h2>

            <p style="margin-top:12px;">
                Practice questions for this subject are coming soon.
            </p>

            <button class="action"
            onclick="openSubject('${subject}','${topic}')">
                ← Back to Topic
            </button>

        `;

        return;

    }

progress.practiceCompleted++;

if(!progress.subjectsStudied.includes(subject)){
    progress.subjectsStudied.push(subject);
}
function saveStudentName(){

    const name = document.getElementById("studentName").value.trim();

    if(name === ""){
        alert("Please enter your name.");
        return;
    }

    localStorage.setItem("studymateStudentName", name);

    alert("Name saved successfully!");

}
saveProgress();
    document.getElementById("studyArea").innerHTML = `

        <h2>✏️ ${subject} Practice</h2>

        <p style="margin-top:12px;">
            <strong>Topic:</strong> ${topic}
        </p>

        <div class="note-box">

            <h3>Practice Questions</h3>

            <ol style="margin-top:12px; padding-left:25px;">

                ${questions.map(function(question){

                    return `
                        <li style="margin-bottom:12px;">
                            ${question}
                        </li>
                    `;

                }).join("")}

            </ol>

        </div>

        <button class="action"
        onclick="openSubject('${subject}','${topic}')">
            ← Back to Topic
        </button>

    `;

}
let progress = JSON.parse(localStorage.getItem("studymateProgress")) || {

    quizzesCompleted: 0,
    practiceCompleted: 0,
    subjectsStudied: []

};


function saveProgress(){

    localStorage.setItem(
        "studymateProgress",
        JSON.stringify(progress)
    );

}
function showProgress(){

    let totalActivities =
        progress.quizzesCompleted +
        progress.practiceCompleted;

    let percentage = totalActivities * 10;

    if(percentage > 100){
        percentage = 100;
    }


    document.getElementById("studyArea").innerHTML = `

        <h2>📊 My Progress</h2>

        <div class="note-box">

            <p>
                📝 Quizzes Completed:
                <strong>${progress.quizzesCompleted}</strong>
            </p>

            <p style="margin-top:12px;">
                ✏️ Practice Completed:
                <strong>${progress.practiceCompleted}</strong>
            </p>

            <p style="margin-top:12px;">
                📚 Subjects Studied:
                <strong>${progress.subjectsStudied.length}</strong>
            </p>

            <p style="margin-top:12px;">
                📈 Overall Progress:
                <strong>${percentage}%</strong>
            </p>

            <div style="
                margin-top:12px;
                width:100%;
                height:18px;
                background:#ddd;
                border-radius:10px;
                overflow:hidden;
            ">

                <div style="
                    width:${percentage}%;
                    height:100%;
                    background:#2563eb;
                "></div>

            </div>

        </div>

        <button class="action"
        onclick="showJHS()">
            ← Back to Subjects
        </button>

    `;

}
 function showPlanner(){
let savedPlan = JSON.parse(
    localStorage.getItem("studymateStudyPlan")
);
    document.getElementById("studyArea").innerHTML = `

        <h2>📅 Study Planner</h2>

        <div class="note-box">

            <p><strong>Plan your study session.</strong></p>

            <label>📚 Subject</label>

            <select id="plannerSubject"
            style="width:100%; padding:12px; margin-top:8px; margin-bottom:15px;">

                <option>English Language</option>
                <option>Mathematics</option>
                <option>Integrated Science</option>
                <option>Social Studies</option>
                <option>Computing</option>
                <option>RME</option>
                <option>French</option>
                <option>Ghanaian Language</option>

            </select>

            <label>📅 Date</label>

            <input type="date"
            id="plannerDate"
            style="width:100%; padding:12px; margin-top:8px;">

            <button class="action"
            onclick="saveStudyPlan()">
                💾 Save Study Plan
            </button>

            <div id="plannerResult"
style="margin-top:15px;">

    ${
        savedPlan
        ? `
            <div class="note-box">
                📌 <strong>Saved Study Plan</strong>

                <p style="margin-top:8px;">
                    📚 ${savedPlan.subject}
                </p>

                <p style="margin-top:5px;">
                    📅 ${savedPlan.date}
                    <button class="action"
type="button"
onclick="localStorage.removeItem('studymateStudyPlan'); showPlanner();">
    🗑️ Delete Study Plan
</button>
                </p>
            </div>
        `
        : ""
    }
function deleteStudyPlan(){

    localStorage.removeItem("studymateStudyPlan");

    showPlanner();

    }
</div>

        </div>

        <button class="action"
        onclick="showJHS()">
            ← Back to Subjects
        </button>

    `;

} 
function saveStudyPlan(){

    const subject = document.getElementById("plannerSubject").value;
    const date = document.getElementById("plannerDate").value;

    if(!date){

        document.getElementById("plannerResult").innerHTML = `
            <div class="note-box">
                ⚠️ Please select a study date.
            </div>
        `;

        return;
    }

    localStorage.setItem(
        "studymateStudyPlan",
        JSON.stringify({
            subject: subject,
            date: date
        })
    );

    document.getElementById("plannerResult").innerHTML = `
        <div class="note-box">
            ✅ <strong>Study Plan Saved!</strong>

            <p style="margin-top:8px;">
                📚 ${subject}
            </p>

            <p style="margin-top:5px;">
                📅 ${date}
            </p>
        </div>
    `;

    }    
showJHS();

</script>

</body>
</html>
